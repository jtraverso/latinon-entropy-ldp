version: v0.4
project:
  name: Counting Steiner designs with prescribed color profiles
  description: For a fixed block size and a fixed vertex coloring into classes of linear size, this
    formalization counts labeled Steiner designs with a prescribed interior integer histogram, bounds
    all fibers above and proves the induced large-deviation principle at speed equal to the number
    of blocks.
  authors:
  - Juan Pablo Traverso Gianini
  responsible_maintainers:
  - Juan Pablo Traverso Gianini
  license: Apache-2.0
